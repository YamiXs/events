name: Build TibiaSweden Events JSON

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug tree
        run: |
          pwd
          ls -la
          echo "---- scripts ----"
          ls -la scripts || true
          echo "---- requirements.txt ----"
          cat requirements.txt || true
          python --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Helps lxml on Linux runners (safe to keep even if not strictly required)
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build events.json
        run: |
          python scripts/build_tibiasweden_events.py --months-back 1 --months-forward 10 --pretty --out events.json

      - name: Commit & push if changed
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Update events.json"
            git push
          else
            echo "No changes."
          fi
